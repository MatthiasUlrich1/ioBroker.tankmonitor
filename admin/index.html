<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>iobroker.tankmonitor - Admin UI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .tab-content { padding: 15px; }
        .nav-tabs .nav-link.active { background-color: #e9ecef; border-bottom-color: transparent; }
        .form-group { margin-bottom: 15px; }
        .form-label { font-weight: 600; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Tankmonitor Adapter Konfiguration</h1>
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="oilview-tab" data-bs-toggle="tab" data-bs-target="#oilview" type="button" role="tab" aria-controls="oilview" aria-selected="true">Oilview</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tankinhaltsanzeige-tab" data-bs-toggle="tab" data-bs-target="#tankinhaltsanzeige" type="button" role="tab" aria-controls="tankinhaltsanzeige" aria-selected="false">Tankinhaltsanzeige</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="liquidcheck-tab" data-bs-toggle="tab" data-bs-target="#liquidcheck" type="button" role="tab" aria-controls="liquidcheck" aria-selected="false">LiquidCheck</button>
            </li>
        </ul>
        <div class="tab-content" id="myTabContent">
            <!-- Oilview Tab -->
            <div class="tab-pane fade show active" id="oilview" role="tabpanel" aria-labelledby="oilview-tab">
                <div class="form-group">
                    <label class="form-label">Benutzername / E-Mail</label>
                    <input type="text" class="form-control" id="oilview-username" placeholder="z.B. admin@beispiel.de">
                </div>
                <div class="form-group">
                    <label class="form-label">Passwort</label>
                    <input type="password" class="form-control" id="oilview-password" placeholder="Passwort">
                </div>
                <div class="form-group">
                    <label class="form-label">Abrufintervall (Minuten)</label>
                    <input type="number" class="form-control" id="oilview-interval" value="15" min="5" max="120">
                </div>
            </div>

            <!-- Tankinhaltsanzeige Tab -->
            <div class="tab-pane fade" id="tankinhaltsanzeige" role="tabpanel" aria-labelledby="tankinhaltsanzeige-tab">
                <div class="form-group">
                    <label class="form-label">Benutzername / E-Mail</label>
                    <input type="text" class="form-control" id="tankinhaltsanzeige-username" placeholder="z.B. admin@beispiel.de">
                </div>
                <div class="form-group">
                    <label class="form-label">Passwort</label>
                    <input type="password" class="form-control" id="tankinhaltsanzeige-password" placeholder="Passwort">
                </div>
                <div class="form-group">
                    <label class="form-label">Abrufintervall (Minuten)</label>
                    <input type="number" class="form-control" id="tankinhaltsanzeige-interval" value="30" min="5" max="120">
                </div>
            </div>

            <!-- LiquidCheck Tab -->
            <div class="tab-pane fade" id="liquidcheck" role="tabpanel" aria-labelledby="liquidcheck-tab">
                <div class="form-group">
                    <label class="form-label">Grafana URL (ohne /api)</label>
                    <input type="url" class="form-control" id="liquidcheck-url" value="https://liquidcheck.si-elektronik.de" placeholder="z.B. https://liquidcheck.si-elektronik.de">
                </div>
                <div class="form-group">
                    <label class="form-label">Benutzername / E-Mail</label>
                    <input type="text" class="form-control" id="liquidcheck-username" placeholder="z.B. admin@beispiel.de">
                </div>
                <div class="form-group">
                    <label class="form-label">Passwort</label>
                    <input type="password" class="form-control" id="liquidcheck-password" placeholder="Passwort">
                </div>
                <div class="form-group">
                    <label class="form-label">Abrufintervall (Minuten)</label>
                    <input type="number" class="form-control" id="liquidcheck-interval" value="5" min="5" max="120">
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end mt-4">
            <button class="btn btn-secondary me-2" onclick="resetForm()">Zurücksetzen</button>
            <button class="btn btn-primary" onclick="saveConfig()">Speichern</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function saveConfig() {
            const config = {
                oilview: {
                    enabled: true,
                    username: document.getElementById('oilview-username').value,
                    password: document.getElementById('oilview-password').value,
                    interval: parseInt(document.getElementById('oilview-interval').value)
                },
                tankinhaltsanzeige: {
                    enabled: true,
                    username: document.getElementById('tankinhaltsanzeige-username').value,
                    password: document.getElementById('tankinhaltsanzeige-password').value,
                    interval: parseInt(document.getElementById('tankinhaltsanzeige-interval').value)
                },
                liquidCheck: {
                    enabled: true,
                    url: document.getElementById('liquidcheck-url').value,
                    username: document.getElementById('liquidcheck-username').value,
                    password: document.getElementById('liquidcheck-password').value,
                    interval: parseInt(document.getElementById('liquidcheck-interval').value)
                }
            };
            // Hier würde die Konfiguration an den Adapter zurückgesendet werden
            console.log('Konfiguration gespeichert:', JSON.stringify(config, null, 2));
            alert('Konfiguration gespeichert!')
        }
        function resetForm() {
            document.querySelectorAll('input').forEach(el => el.value = '');
        }
    </script>
</body>
</html>
